name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The lint / type-check / test scope is `src tests scripts` everywhere: here, in
# the Makefile and in the README. Notebooks are excluded deliberately and that
# exclusion is declared in pyproject.toml, not by omitting them from a command.
env:
  QUALITY_SCOPE: src tests scripts

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff
        run: ruff check ${{ env.QUALITY_SCOPE }}
      - name: Black
        run: black --check ${{ env.QUALITY_SCOPE }}

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Mypy
        # This job exists because the previous one was named "type-check" and
        # ran no type checker. It runs one.
        run: mypy ${{ env.QUALITY_SCOPE }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Tests
        # The NASA archive is not downloaded in CI, so the one test that parses
        # real .mat files is deselected. Everything else runs against the
        # synthetic generator and needs no data.
        run: pytest -m "not slow" --cov=battery_rul --cov-report=term-missing

  smoke:
    name: End-to-end pipeline (synthetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Milestone 1 — full pipeline on synthetic cells
        # Proves the five stages wire together end to end without the 209 MB
        # dataset. Metrics from this run describe the simulator, not real cells,
        # and are not published anywhere.
        run: python scripts/run_pipeline.py --config configs/synthetic.yaml

      - name: Milestone 2 — digital-twin pipeline on synthetic cells
        run: python -m battery_rul.pipelines.run_milestone_2 --config configs/synthetic.yaml --set multitask.epochs=8

      - name: Example snapshot
        run: python scripts/example_snapshot.py --config configs/synthetic.yaml

      - name: Check the expected artifacts exist
        run: |
          test -f models/trained_model.pkl
          test -f models/feature_pipeline.pkl
          test -f reports/metrics.json
          test -f reports/evaluation_report.md
          test -f reports/milestone_2/metrics.json
          test -f reports/milestone_2/evaluation_report.md
          test -f reports/milestone_2/example_snapshot.json
          test -f artifacts/rul/metadata.json
          test -f artifacts/soh/metadata.json
          test -f artifacts/risk/metadata.json
          test -f artifacts/multitask/model.pkl
          echo "All expected artifacts present."

      - name: Streamlit dashboard imports and compiles
        run: python -c "import battery_rul.dashboard.app as m; assert hasattr(m, 'main')"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-outputs
          path: |
            reports/
            figures/
            artifacts/
          retention-days: 7

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: No absolute machine paths in committed artifacts
        run: python scripts/sanitise_reports.py --check
