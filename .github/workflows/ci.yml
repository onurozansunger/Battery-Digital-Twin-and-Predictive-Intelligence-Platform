name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The lint / type-check / test scope is `src tests scripts` everywhere: here, in
# the Makefile and in the README. Notebooks are excluded deliberately and that
# exclusion is declared in pyproject.toml, not by omitting them from a command.
env:
  QUALITY_SCOPE: src tests scripts

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check ${{ env.QUALITY_SCOPE }}
      - name: Black
        run: black --check ${{ env.QUALITY_SCOPE }}

  type-check:
    name: type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Mypy
        # This job exists because the previous one was named "type-check" and
        # ran no type checker. It runs one.
        run: mypy ${{ env.QUALITY_SCOPE }}

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Tests
        # The NASA archive is not downloaded in CI, so the one test that parses
        # real .mat files is deselected. Everything else runs against the
        # synthetic generator and needs no data.
        run: >
          pytest -m "not slow" --cov=battery_rul --cov-report=term-missing
          --cov-fail-under=75

  smoke:
    name: End-to-end pipeline (synthetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .

      - name: Milestone 1 — full pipeline on synthetic cells
        # Proves the five stages wire together end to end without the 209 MB
        # dataset. Metrics from this run describe the simulator, not real cells,
        # and are not published anywhere.
        run: python scripts/run_pipeline.py --config configs/synthetic.yaml

      - name: Milestone 2 — digital-twin pipeline on synthetic cells
        run: python -m battery_rul.pipelines.run_milestone_2 --config configs/synthetic.yaml --set multitask.epochs=8

      - name: Example snapshot
        run: python scripts/example_snapshot.py --config configs/synthetic.yaml

      - name: Check the expected artifacts exist
        run: |
          test -f models/trained_model.pkl
          test -f models/feature_pipeline.pkl
          test -f reports/metrics.json
          test -f reports/evaluation_report.md
          test -f reports/milestone_2/metrics.json
          test -f reports/milestone_2/evaluation_report.md
          test -f reports/milestone_2/example_snapshot.json
          test -f artifacts/rul/metadata.json
          test -f artifacts/soh/metadata.json
          test -f artifacts/risk/metadata.json
          test -f artifacts/multitask/model.pkl
          echo "All expected artifacts present."

      - name: Milestone 3 — drift reference from the training partition
        run: python -m battery_rul.pipelines.build_reference --config configs/synthetic.yaml

      - name: Milestone 3 — fleet batch
        run: >
          python -m battery_rul.pipelines.run_fleet_batch
          --config configs/synthetic.yaml --fleet-id CI-FLEET --source processed

      - name: Milestone 3 — monitoring run
        run: >
          python -m battery_rul.pipelines.run_monitoring
          --config configs/synthetic.yaml --fleet-id CI-FLEET --source processed

      - name: Milestone 3 — fleet report
        run: >
          python -m battery_rul.pipelines.generate_fleet_report
          --config configs/synthetic.yaml --fleet-id CI-FLEET

      - name: Milestone 3 — registry round trip
        # Registers the bundle CI just built and evaluates the promotion gate.
        # `|| true` on the gate is deliberate: a REJECTED verdict exits 2, and a
        # gate that fails the build would create pressure to loosen it.
        # Promotion itself is never automated here.
        run: |
          python -m battery_rul.pipelines.register_model \
            --config configs/synthetic.yaml --model-name ci-rul --model-version 0.0.1 \
            --bundle artifacts/rul --validation-status VALIDATED --overwrite
          python -m battery_rul.pipelines.evaluate_promotion \
            --config configs/synthetic.yaml --model-name ci-rul --model-version 0.0.1 \
            --unit-tests --contract-tests --smoke-test --leakage-check || true

      - name: Check the Milestone 3 artifacts exist
        run: |
          test -f artifacts/monitoring/reference_distributions/training_reference.json
          test -f reports/milestone_3/fleet_summary.json
          test -f reports/milestone_3/data_quality_report.json
          test -f reports/milestone_3/feature_drift_report.json
          test -f reports/milestone_3/model_performance_report.json
          test -f reports/milestone_3/fleet_report.md
          test -f artifacts/registry/models.json
          echo "All expected Milestone 3 artifacts present."

      - name: Streamlit dashboards import and compile
        run: |
          python -c "import battery_rul.dashboard.app as m; assert hasattr(m, 'main')"
          python -c "import battery_rul.dashboard.fleet_app as m; assert hasattr(m, 'main')"

      - name: The sanitiser strips the paths a fresh run writes
        # Freshly generated Milestone 1/2 artifacts *do* contain absolute paths —
        # the pipelines write them and `sanitise_reports.py` is the step that
        # removes them before anything is committed. Running only `--check` here
        # asserted the opposite and failed, correctly. What is worth testing is
        # the cycle a developer actually performs: sanitise, then verify. The
        # `hygiene` job separately checks the artifacts already in git.
        run: |
          python scripts/sanitise_reports.py
          python scripts/sanitise_reports.py --check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pipeline-outputs
          path: |
            reports/
            figures/
            artifacts/
          retention-days: 7

  contract:
    name: API contract and model-bundle fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Contract, regression and smoke tests
        # These run against fixture bundles built inside the tests, so they need
        # neither the dataset nor a trained model, and they are the gate that
        # catches a breaking change to a published response shape.
        run: >
          pytest -m "not slow"
          tests/test_fleet_api.py
          tests/test_milestone_3_regression.py
          tests/test_registry.py
          tests/test_persistence.py
          -q

      - name: Import smoke test
        run: |
          python -c "import battery_rul.api.app, battery_rul.api.fleet_routes"
          python -c "import battery_rul.fleet, battery_rul.monitoring, battery_rul.registry"
          python -c "import battery_rul.persistence, battery_rul.tracking, battery_rul.observability"

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: No absolute machine paths in committed artifacts
        run: python scripts/sanitise_reports.py --check
      - name: No committed secrets
        run: python scripts/check_secrets.py
      - name: README results match the committed evaluation artifacts
        run: python scripts/update_readme_results.py --check
