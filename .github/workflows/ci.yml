name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check src tests scripts

      - name: Black
        run: black --check src tests scripts

      - name: Tests
        # The NASA archive is not downloaded in CI, so the one test that parses
        # real .mat files is deselected. Everything else runs against the
        # synthetic generator and needs no data.
        run: pytest -m "not slow" --cov=battery_rul --cov-report=term-missing

  smoke:
    name: End-to-end pipeline (synthetic)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run the full pipeline on synthetic cells
        # Proves the five stages wire together end to end without needing the
        # 209 MB dataset. Metrics from this run describe the simulator, not real
        # cells, and are not published anywhere.
        run: python scripts/run_pipeline.py --config configs/synthetic.yaml

      - name: Check the expected artifacts exist
        run: |
          test -f models/trained_model.pkl
          test -f models/feature_pipeline.pkl
          test -f reports/metrics.json
          test -f reports/evaluation_report.md
          echo "All expected artifacts present."

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pipeline-outputs
          path: |
            reports/
            figures/
          retention-days: 7
