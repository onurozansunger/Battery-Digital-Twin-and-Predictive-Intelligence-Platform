name: Security

# Dependency and repository-hygiene checks. Deliberately built from tools that
# need no account and no token: a security workflow that only runs when someone
# has configured a service is a security workflow that does not run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after a merge is still found.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "." pip-audit
      - name: pip-audit
        # Reported, not enforced: this project's dependency tree includes
        # scientific libraries whose advisories are frequently unfixable in the
        # short term, and a blocking audit would train reviewers to skip it. The
        # report is read; a finding is triaged in a follow-up.
        run: pip-audit --strict --progress-spinner off || true
      - name: pip-audit (blocking on the serving surface)
        # The packages that actually face untrusted input do block.
        run: pip-audit --strict --progress-spinner off -r <(pip freeze | grep -Ei '^(fastapi|starlette|uvicorn|pydantic|httpx|jinja2|urllib3|requests)=') || exit 1

  static-analysis:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]
      - name: Bandit
        # -ll: medium severity and above. The known-and-accepted findings are
        # the joblib loads, which are documented in docs/SECURITY.md and only
        # ever read paths this process configured.
        run: bandit -r src/battery_rul -ll -x tests

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the working tree
        run: python scripts/check_secrets.py

  filesystem-hygiene:
    name: No absolute machine paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Check committed artifacts
        run: python scripts/sanitise_reports.py --check
