name: Security

# Dependency and repository-hygiene checks. Deliberately built from tools that
# need no account and no token: a security workflow that only runs when someone
# has configured a service is a security workflow that does not run.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a vulnerability disclosed after a merge is still found.
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
      - name: pip-audit
        # Audit the complete published lock, not the editable local package
        # (battery-rul is not published on PyPI). Every dependency is pinned,
        # so resolving or installing the full ML environment is unnecessary.
        run: pip-audit --strict --disable-pip --no-deps --progress-spinner off -r requirements-lock.txt

  static-analysis:
    name: Static analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install bandit[toml]
      - name: Bandit
        # -ll: medium severity and above. The known-and-accepted findings are
        # the joblib loads, which are documented in docs/SECURITY.md and only
        # ever read paths this process configured.
        run: bandit -r src/battery_rul -ll -x tests

  secrets:
    name: No committed secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Scan the working tree
        run: python scripts/check_secrets.py

  filesystem-hygiene:
    name: No absolute machine paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt
          pip install --no-deps -e .
      - name: Check committed artifacts
        run: python scripts/sanitise_reports.py --check
