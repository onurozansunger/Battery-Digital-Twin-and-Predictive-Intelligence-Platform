# Smoke-test configuration: the full pipeline in well under a minute.
# Used by CI and by `make smoke`. Numbers from this config are NOT results.
extends: default.yaml

experiment_name: battery_rul_fast
description: Fast smoke run — reduced model zoo and shortened neural training.

models:
  enabled: [linear_regression, ridge, random_forest, lightgbm, gru]
  select_by: rmse
  select_mode: min
  params: {}
  sequence:
    window: 10
    stride: 1
    hidden_size: 32
    num_layers: 1
    dropout: 0.1
    bidirectional: false
    d_model: 32
    nhead: 2
    dim_feedforward: 64
  training:
    epochs: 15
    batch_size: 32
    learning_rate: 0.003
    weight_decay: 0.0001
    grad_clip: 1.0
    early_stopping_patience: 5
    lr_scheduler: plateau
    loss: huber
    huber_delta: 5.0
    device: cpu
    num_workers: 0
    seed: 42

evaluation:
  # A three-candidate nested comparison keeps the smoke run honest about the
  # design without paying for the full zoo.
  nested_enabled: true
  nested_candidates: [cohort_median_life, capacity_fade_extrapolation, ridge]
  nested_select_by: mae
  metrics: [mae, rmse, mape, r2]
  mape_epsilon: 1.0
  alpha: 0.2
  residual_bins: 30
  bootstrap_samples: 100
  confidence_level: 0.95
  per_battery_breakdown: true
  learning_curve_fractions: [0.5, 1.0]

explainability:
  enabled: true
  shap_enabled: true
  shap_max_samples: 300
  shap_background_samples: 50
  permutation_repeats: 3
  top_k_features: 15
  error_analysis_quantile: 0.9
