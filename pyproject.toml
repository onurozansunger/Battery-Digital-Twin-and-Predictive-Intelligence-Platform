[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-rul"
version = "0.1.0"
description = "Research prototype for battery remaining-useful-life prediction and fleet intelligence."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Onur Ozan Sunger" }]
keywords = ["battery", "prognostics", "remaining-useful-life", "time-series", "machine-learning"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "tqdm>=4.66",
    "rich>=13.7",
    "optuna>=3.5",
]

[project.optional-dependencies]
classical = [
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "catboost>=1.2",
]
neural = ["torch>=2.1"]
serving = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "streamlit>=1.31",
]
explain = ["shap>=0.44"]
# Convenience extra for the complete modelling and serving platform. Keeping
# the named extras above means a core install no longer pulls several GB of
# neural, booster, explainability and dashboard dependencies.
all = [
    "xgboost>=2.0",
    "lightgbm>=4.1",
    "catboost>=1.2",
    "torch>=2.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.26",
    "streamlit>=1.31",
    "shap>=0.44",
]
dev = [
    "build>=1.2",
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "black>=24.1",
    "mypy>=1.8",
    "jupyter>=1.0",
    "uv>=0.9",
]

[project.scripts]
battery-rul = "battery_rul.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
battery_rul = ["py.typed"]

# ----------------------------------------------------------------------------
# Tooling
# ----------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
# Must match `requires-python` above. With py312 here, the UP rules "modernise"
# code into syntax that 3.11 cannot parse — which is how `type X = ...` reached
# CI and broke the 3.11 job while every local check passed.
target-version = "py311"
src = ["src", "tests", "scripts"]
# Notebooks are intentionally out of scope for linting: they are exploratory
# records, not production code. README and CI use exactly this scope.
extend-exclude = ["notebooks", "build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ARG", "PTH", "RET", "TID"]
ignore = ["E501", "B008", "N803", "N806"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# The stage dispatch table takes a uniform (cfg, args) signature so a stage can
# start using `args` without changing every other entry.
"src/battery_rul/pipelines/milestone_2.py" = ["ARG005"]
# `fit(train, val)` is the BaseModel contract; a model that ignores the
# validation partition still has to accept it.
"src/battery_rul/models/baselines.py" = ["ARG002"]

[tool.mypy]
# Was "3.11" — the lowest supported interpreter — so that 3.12-only constructs
# were caught here rather than in the 3.11 test job. That stopped being possible:
# NumPy's own stubs now use `type X = ...`, which mypy refuses to parse under
# python_version = 3.11, and a fatal error in a third-party stub prevents any
# checking at all ("Found 1 error in 1 file (errors prevented further checking)").
#
# The 3.11 guarantee did not disappear with it. The Tests (3.11) CI job imports
# every module in this package, so 3.12-only syntax in our own code fails there
# immediately — which is where the original regression was caught in the first
# place. This setting was belt to that job's braces, and the belt no longer fits.
python_version = "3.12"
# `warn_return_any` fires almost exclusively on values returned from numpy,
# pandas, torch and sklearn calls whose stubs return Any. Those warnings are
# noise that trains reviewers to skim the type-check output, which is worse than
# not running it. The checks that catch real defects here are the argument and
# attribute ones, and those stay on.
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false
# Notebooks are exploratory and are excluded from every quality gate — see the
# Ruff configuration below and the CI workflow, which use the same scope.
exclude = ["^notebooks/", "^build/", "^dist/"]

[[tool.mypy.overrides]]
# Matplotlib's `subplots()` is typed as returning `Axes | ndarray[Axes]`, so
# every single-axes call reads as a possible array to the checker. The
# visualisation modules are almost entirely such calls; the resulting union-attr
# errors say nothing about correctness and would need a cast on every line.
module = ["battery_rul.visualization.*", "battery_rul.explainability.explain"]
disable_error_code = ["union-attr", "index", "attr-defined", "misc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: end-to-end pipeline tests",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning"]
